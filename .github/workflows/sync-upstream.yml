name: Sync upstream source

on:
  # GitHub schedules are polling rather than a true upstream webhook. The
  # manual trigger is useful when the upstream repository has just changed.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Merge upstream master
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/alpha123/uma-tools.git
          git fetch --no-tags upstream master

          branch='automation/upstream-sync'
          git switch -C "$branch"
          if git merge --no-edit upstream/master; then
            echo "merge_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Upstream changes conflict with local simulator changes. Resolve the sync manually."
            git merge --abort
            exit 1
          fi

          if git diff --quiet "origin/master"...HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push --force-with-lease origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update upstream pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/upstream-sync
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --base master --head "$BRANCH" --state open --json number --jq 'length')"
          if [[ "$existing" == '0' ]]; then
            gh pr create \
              --base master \
              --head "$BRANCH" \
              --title 'Sync updates from alpha123/uma-tools' \
              --body $'This automated PR contains the latest upstream source/data changes.\n\nThe Pages workflow will run data-integrity checks, condition coverage checks, branch/scaling audits, regression tests, and a production build before deployment.'
          else
            echo "An upstream sync PR is already open; its branch was updated."
          fi
